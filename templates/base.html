<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Tic-Tac-Toe{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <!-- Shared pencil filter: makes every stroke slightly wobbly -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="rough" filterUnits="userSpaceOnUse" x="-50" y="-50" width="500" height="500">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.6"/>
    </filter>
  </svg>

  <header class="top-bar">
    <a class="logo" href="{{ url_for('index') }}">Tic-Tac-Toe</a>
    <nav>
      <a href="{{ url_for('index') }}" {% if page == 'home' %}class="here"{% endif %}>Home</a>
      <a href="{{ url_for('play') }}" {% if page == 'play' %}class="here"{% endif %}>Game</a>
      <a href="{{ url_for('lab') }}" {% if page == 'lab' %}class="here"{% endif %}>Lab</a>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='js/pencil.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
